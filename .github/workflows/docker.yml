name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-image:
    name: Build and smoke-test production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull -t lazix:ci .

      - name: Start container
        run: docker run -d --name lazix-ci -p 127.0.0.1:3000:3000 lazix:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker logs lazix-ci
          exit 1

      - name: Verify health response does not expose secrets
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('health.json','utf8')); if(data.status!=='ok'||data.service!=='lazix'||typeof data.configuration?.aiProviderConfigured!=='boolean'||typeof data.configuration?.supabaseConfigured!=='boolean') process.exit(1); if(JSON.stringify(data).match(/api[_-]?key|secret|token/i)) process.exit(1);"

      - name: Show container logs on failure
        if: failure()
        run: docker logs lazix-ci

      - name: Stop container
        if: always()
        run: docker rm -f lazix-ci || true
