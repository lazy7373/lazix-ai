services:
  lazix-model:
    image: vllm/vllm-openai:latest
    container_name: lazix-model
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - model-cache:/root/.cache/huggingface
    command:
      - --model
      - ${LAZIX_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${LAZIX_INFERENCE_TOKEN:?Set LAZIX_INFERENCE_TOKEN before starting}
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  model-cache:
